name: 🚀 Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter (matching pubspec.yaml sdk: ^3.10.4)
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      # 3. Create .env file for the build (uses GitHub secret for prod URL)
      - name: 🔑 Create .env file
        run: |
          echo "# Flutter App Environment Variables" > .env
          echo "# Backend API URL (Render deployment)" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'https://e-commerce-app-laravel.onrender.com/api' }}" >> .env
          echo "APP_NAME=E-Commerce App" >> .env
          echo "APP_DEBUG=false" >> .env

      # 4. Install dependencies
      - name: 📥 Install dependencies
        run: flutter pub get

      # 5. Build Flutter Web
      - name: 🔨 Build Flutter Web
        run: flutter build web --release --no-tree-shake-icons

      # 6. Deploy build/web output to Vercel
      - name: 🌐 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web
          vercel-args: '--prod'
